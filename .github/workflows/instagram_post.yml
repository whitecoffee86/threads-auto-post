name: 티스토리 → 인스타 캐러셀 자동 발행

on:
  schedule:
    - cron: '47 3 * * *'    # 점심 12시 47분 KST — 릴스만 (10/19부터 릴스 하루 2개)
    - cron: '17 4 * * *'    # 예비 1시 17분 (중복은 코드가 막음)
    - cron: '47 11 * * *'   # 오후 8시 47분 KST
    - cron: '17 12 * * *'   # 예비 9시 17분 (GitHub 예약 지연 대비, 중복은 코드가 막음)
    - cron: '47 12 * * *'   # 예비 9시 47분
  workflow_dispatch:
    inputs:
      dry_run:
        description: '테스트 모드 (이미지만 만들고 업로드 안 함)'
        type: boolean
        default: true
      reel_test:
        description: '릴스 업로드 점검만 (게시 안 함)'
        type: boolean
        default: false
      post_url:
        description: '특정 티스토리 글 URL (비우면 자동 선택)'
        required: false
        default: ''

concurrency:
  group: repo-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: apt 패키지 캐시
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-noble-fonts-ffmpeg-v1

      - name: 패키지·한글 폰트 설치
        timeout-minutes: 14
        run: |
          # 2026-10-27: apt 미러가 응답 없이 멈춰 10분 타임아웃 실패가 반복됨 → 시도마다 시간 제한을 걸어 재시도가 실제로 돌게 함
          # 2026-10-28: 느린 미러(~100KB/s)에선 재시도로도 못 받음 → 받은 .deb 를 캐시해 다시 안 받음, 설치 실패면 글꼴 없는 장표가 나가지 않게 여기서 멈춤
          mkdir -p ~/apt-cache/partial
          APT_OPTS="-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 -o Dir::Cache::Archives=$HOME/apt-cache"
          for i in 1 2 3; do sudo timeout 120 apt-get $APT_OPTS update -qq && sudo timeout 180 apt-get $APT_OPTS install -y -qq fonts-noto-cjk fonts-noto-color-emoji ffmpeg && break; sudo dpkg --configure -a || true; sleep 10; done
          dpkg -s fonts-noto-cjk ffmpeg >/dev/null || { echo "::error::apt 설치 실패(미러 지연)"; exit 1; }
          sudo rm -rf ~/apt-cache/partial ~/apt-cache/lock; sudo chown -R "$USER" ~/apt-cache
          pip install anthropic feedparser requests playwright cryptography
          # 크롬 실행 라이브러리는 러너 이미지에 이미 있음(--with-deps 는 쓰지 않는 글꼴 ~20MB 만 더 받아 느린 미러에서 멈췄음)
          playwright install chromium

      - name: git 설정
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      - name: 캐러셀 생성·발행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          IG_POST_URL: ${{ inputs.post_url }}
          IG_REEL_TEST: ${{ inputs.reel_test && '1' || '0' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python post_to_instagram.py

      - name: 테스트 결과 이미지 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carousel
          path: ig_images/
          if-no-files-found: ignore

      - name: 발행 기록·토큰 저장
        if: always() && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
        run: |
          git add instagram_history.json
          if [ -f ig_token.enc ]; then git add ig_token.enc; fi
          git diff --staged --quiet || git commit -m "인스타 발행 기록 업데이트"
          git pull --rebase --autostash origin main && git push
