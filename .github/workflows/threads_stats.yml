name: 주간 성과 기록 (스레드·인스타)

on:
  schedule:
    - cron: '7 13 * * 0'   # 매주 일요일 밤 10시 7분 KST
  workflow_dispatch:

concurrency:
  group: repo-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests cryptography
      - name: 성과 수집
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python threads_stats.py >> "$GITHUB_STEP_SUMMARY" || echo "스레드 성과 수집 실패"
      - name: 인스타 성과 수집
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python ig_stats.py >> "$GITHUB_STEP_SUMMARY" || echo "인스타 성과 수집 실패"
      - name: 기록 저장
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A threads_stats.json threads_report.md ig_stats.json ig_report.md 2>/dev/null || true
          git diff --staged --quiet || git commit -m "주간 성과 기록"
          git pull --rebase --autostash origin main && git push
